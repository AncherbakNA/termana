[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "termana"
version = "0.1.1"
description = "A cross-platform terminal application"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    # Primary SSH/SFTP engine; authentication proof upgrades need contract review.
    "asyncssh[bcrypt]==2.24.1",
    "keyring>=25.7,<26",
    "PySide6>=6.8.6,<7",
    "pyte>=0.8.2,<0.9",
    "wcwidth>=0.2.13,<1",
]

[project.optional-dependencies]
# Keep the previous install command compatible; SSH is now a base dependency.
embedded-ssh = []
dev = [
    "build>=1.2,<2",
    "pytest>=8.4",
    "ruff>=0.12",
]

[project.scripts]
termana-askpass = "termana.credentials.askpass_helper:main"

[tool.hatch.build.targets.wheel]
packages = ["src/termana"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
