[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "termana"
version = "0.1.2"
description = "A cross-platform terminal application"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    # Primary SSH/SFTP engine; authentication proof upgrades need contract review.
    "asyncssh[bcrypt]==2.24.1",
    "keyring>=25.7,<26",
    "PySide6>=6.8.6,<7",
    "pyte>=0.8.2,<0.9",
    # HTTPS uses OS trust, not a developer machine's external CA bundle.
    "truststore==0.10.5",
    "wcwidth>=0.2.13,<1",
]

[project.optional-dependencies]
# Keep the previous install command compatible; SSH is now a base dependency.
embedded-ssh = []
dev = [
    "build>=1.2,<2",
    "pytest>=8.4",
    "ruff>=0.12",
]

[project.scripts]
termana-askpass = "termana.ssh.askpass_helper:main"

[tool.hatch.build.targets.wheel]
packages = ["src/termana"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
# tests/build is a functional area, not the generated build output. testpaths
# already scopes discovery to tests; preserve pytest's other default exclusions.
norecursedirs = [".*", "dist", "*.egg", "_darcs", "CVS", "node_modules", "venv", "{arch}"]
markers = [
    "native: requires a named native OS capability or desktop platform",
    "live: opt-in interaction with a running approved peer",
    "lab: requires separately authorized laboratory infrastructure",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
